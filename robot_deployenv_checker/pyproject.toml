[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deployenv-checker"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "viser",
    "yourdfpy",
    "trimesh",
    "numpy",
    "pyyaml",
    "dacite",
    "ampl",
    "wbc-py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ampl = { path = "../../../whls/ampl-0.0.25-cp310-cp310-linux_x86_64.whl" }
wbc-py = { path = "../../../whls/wbc_py-0.2.3-cp310-cp310-linux_x86_64.whl" }


